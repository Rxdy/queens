name: CI/CD

on:
  # Tests : sur chaque PR, et appelés par images.yml avant le build qui suit une fusion dans dev
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────── Phase 1 : LINT ──────────────────────────
  lint-front:
    name: Lint front (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front
      - run: npm run lint
        working-directory: front

  lint-python:
    name: Lint python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.22
      - run: ruff check .
      - run: ruff format --check .

  # ────────────────────────── Phase 2 : TESTS ─────────────────────────
  test-front:
    name: Tests front (vitest)
    needs: lint-front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front
      - run: npm test -- --run
        working-directory: front

  test-python:
    name: Tests python (pytest)
    needs: lint-python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [TRM, baseline-8queens]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
        working-directory: ${{ matrix.dir }}
      - run: python -m pytest -q
        working-directory: ${{ matrix.dir }}
