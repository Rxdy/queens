name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ────────────────────────── Phase 1 : LINT ──────────────────────────
  lint-front:
    name: Lint front (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front
      - run: npm run lint
        working-directory: front

  lint-python:
    name: Lint python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  # ────────────────────────── Phase 2 : TESTS ─────────────────────────
  test-front:
    name: Tests front (vitest)
    needs: lint-front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front
      - run: npm test -- --run
        working-directory: front

  test-python:
    name: Tests python (pytest)
    needs: lint-python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [TRM, baseline-8queens]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
        working-directory: ${{ matrix.dir }}
      - run: python -m pytest -q
        working-directory: ${{ matrix.dir }}

  # ─────────────────── Phase 3 : BUILD & PUSH (arm64 → GHCR) ───────────
  build-push:
    name: Build & push ${{ matrix.service }}
    needs: [test-front, test-python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: queens
            context: ./front
          - service: trm-solveur
            context: ./TRM
          - service: baseline-solveur
            context: ./baseline-8queens
    steps:
      - uses: actions/checkout@v4

      - name: Nom du propriétaire en minuscules
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/arm64 pour le Raspberry Pi)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/queens-${{ matrix.service }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/queens-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
