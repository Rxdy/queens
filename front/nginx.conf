server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TRM API – proxy direct
    location /api/ {
        proxy_pass         http://trm-solveur:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Baseline API – supprime le préfixe /baseline avant de transmettre
    location /baseline/ {
        rewrite            ^/baseline(/.*)$ $1 break;
        proxy_pass         http://baseline-solveur:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA – renvoie index.html pour toutes les routes Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
