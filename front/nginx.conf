# ── Rate limiting ────────────────────────────────────────────────────────────
# Zone générale : 30 req/s par IP (burst 60 sans délai)
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
# Zone API : 10 req/s par IP (burst 20 sans délai) — plus strict sur les endpoints lourds
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression gzip ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # ── Cache assets statiques (JS/CSS avec hash Vite = immutables) ──────────
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Headers de sécurité ───────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob:; connect-src 'self';" always;
    # HSTS : forcer HTTPS (Cloudflare gère le TLS, le tunnel est en HTTP en interne)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Masquer la version de Nginx
    server_tokens off;

    # TRM API – proxy direct
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://trm-solveur:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Taille max upload (images)
        client_max_body_size 10m;
    }

    # Baseline API – supprime le préfixe /baseline avant de transmettre
    location /baseline/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        rewrite            ^/baseline(/.*)$ $1 break;
        proxy_pass         http://baseline-solveur:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        client_max_body_size 10m;
    }

    # SPA – renvoie index.html pour toutes les routes Vue Router
    location / {
        limit_req zone=general burst=60 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.html;
    }
}

