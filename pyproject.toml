[tool.ruff]
line-length = 100
target-version = "py311"
src = ["TRM", "baseline-8queens"]
# Scripts de recherche/entraînement ML (non servis par l'API) : hors périmètre lint.
extend-exclude = [
    "baseline-8queens/src/train.py",
    "baseline-8queens/src/viz.py",
    "baseline-8queens/src/viz_train.py",
    "baseline-8queens/src/data.py",
    "baseline-8queens/src/eval.py",
    "baseline-8queens/src/metrics.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "utils", "src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
