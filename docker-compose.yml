services:
    queens:
        image: node:20
        working_dir: /app
        ports:
            - "5173:5173"
        volumes:
            - ./front:/app
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        stop_grace_period: 1s
        depends_on:
            - trm-solveur

    trm-solveur:
        image: python:3.11
        working_dir: /app
        ports:
            - "8000:8000"
        volumes:
            - ./TRM:/app
        command: sh -c "pip install -r requirements.txt && uvicorn app:app --host 0.0.0.0 --port 8000 --reload"
        stop_grace_period: 1s

    baseline-solveur:
        image: python:3.11
        working_dir: /app
        ports:
            - "8001:8001"
        volumes:
            - ./baseline-8queens:/app
        command: sh -c "pip install -r requirements.txt && uvicorn app:app --host 0.0.0.0 --port 8001 --reload"
        stop_grace_period: 1s
