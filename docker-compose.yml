services:
    queens:
        image: node:20
        working_dir: /app
        ports:
            - "5173:5173"
        volumes:
            - ./front:/app
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        stop_grace_period: 1s
        depends_on:
            trm-solveur:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s

    trm-solveur:
        image: python:3.11
        working_dir: /app
        ports:
            - "8000:8000"
        volumes:
            - ./TRM:/app
        command: sh -c "pip install -r requirements.txt && uvicorn app:app --host 0.0.0.0 --port 8000 --reload"
        stop_grace_period: 1s
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s

    baseline-solveur:
        image: python:3.11
        working_dir: /app
        ports:
            - "8001:8001"
        volumes:
            - ./baseline-8queens:/app
        command: sh -c "pip install -r requirements.txt && uvicorn app:app --host 0.0.0.0 --port 8001 --reload"
        stop_grace_period: 1s
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
