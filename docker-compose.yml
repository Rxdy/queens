services:
    queens:
        image: ghcr.io/rxdy/queens-queens:latest
        build: ./front
        ports:
            - "5173:80"
        depends_on:
            trm-solveur:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s
        stop_grace_period: 1s
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.queens.rule=Host(`queens.rxdy.fr`)"
            - "traefik.http.routers.queens.entrypoints=web"
            - "traefik.http.services.queens.loadbalancer.server.port=80"
        networks:
            - web
            - default

    trm-solveur:
        image: ghcr.io/rxdy/queens-trm-solveur:latest
        build: ./TRM
        ports:
            - "8000:8000"
        stop_grace_period: 1s
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

    baseline-solveur:
        image: ghcr.io/rxdy/queens-baseline-solveur:latest
        build: ./baseline-8queens
        ports:
            - "8001:8001"
        stop_grace_period: 1s
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

networks:
    web:
        external: true
    default: {}
